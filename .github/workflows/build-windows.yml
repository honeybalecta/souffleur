name: Windows-Installer bauen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["windows/**", "web/**", "tools/**", "package.json", "version.txt", ".github/workflows/build-windows.yml"]

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          "SF_VERSION=$v" >> $env:GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sprachmodell zwischenspeichern
        uses: actions/cache@v4
        with:
          path: ~/.cache/souffleur
          key: vosk-model-small-de-0.15

      - name: Abhängigkeiten, Oberfläche und Sprachmodell
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          node tools/vendor.mjs
          python -m pip install --upgrade pip
          pip install -r windows/requirements.txt pyinstaller
          python tools/fetch_model.py build/model-de
          Set-Content -Path build/app-version.txt -Value $env:SF_VERSION -NoNewline

      - name: Programm bauen (PyInstaller)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean windows/souffleur.spec 2>&1 | Tee-Object -FilePath build.log
          if (-not (Test-Path dist\Souffleur\Souffleur.exe)) { throw "PyInstaller hat keine EXE erzeugt" }

      - name: Selbsttest des gebauten Programms
        shell: pwsh
        run: |
          $p = Start-Process dist\Souffleur\Souffleur.exe -ArgumentList "--selftest", "$pwd\selftest.json" -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen" }

      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer.iss
          Get-ChildItem dist\*.exe | Format-Table Name, Length

      - name: Build-Log im Zweig ci-log-windows ablegen
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci_log.sh windows "${{ job.status }}" build.log selftest.json

      - uses: actions/upload-artifact@v4
        with:
          name: Souffleur-Windows
          path: dist/Souffleur-Setup-*.exe
          compression-level: 0

      - name: Als Release veröffentlichen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:SF_VERSION"
          $file = (Get-ChildItem dist\Souffleur-Setup-*.exe | Select-Object -First 1).FullName
          for ($i = 1; $i -le 4; $i++) {
            gh release view $tag 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { gh release upload $tag $file --clobber }
            else { gh release create $tag $file --title "Souffleur $env:SF_VERSION" --notes "Android-APK (Android 10 und neuer, ARM64) und Windows-Installer. Spracherkennung offline mit Vosk, deutsches Modell." }
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 15
          }
